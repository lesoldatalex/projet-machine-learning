version: '3.8'
services:
  mlflow:
    image: python:3.11-slim
    container_name: mlflow_local
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:rw
    command: bash -c "pip install --no-cache-dir mlflow && mlflow server --backend-store-uri sqlite:///mlflow/db/mlflow.db --default-artifact-root file:./mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - '5000:5000'
    restart: unless-stopped
